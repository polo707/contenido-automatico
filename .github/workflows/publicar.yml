name: Publicar imagen

on:
  # ------------------------------------------------------------------
  # HORARIO: 4 publicaciones por día.
  # GitHub usa hora UTC. Montevideo = UTC-3, así que sumale 3 horas.
  #   09:07 Montevideo -> 12:07 UTC
  #   13:07 Montevideo -> 16:07 UTC
  #   18:07 Montevideo -> 21:07 UTC
  #   21:07 Montevideo -> 00:07 UTC
  # Para cambiar horarios, editá los números de horas (0,12,16,21).
  # Ojo: GitHub puede demorar entre 5 y 30 min en arrancar cada ejecución.
  # ------------------------------------------------------------------
  schedule:
    - cron: "7 0,12,16,21 * * *"
  # Botón "Run workflow" para probar a mano desde la pestaña Actions
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Modo prueba (no publica nada de verdad)"
        type: choice
        options: ["no", "si"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Publicar la próxima imagen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ vars.UPLOADPOST_USER }}
          UPLOADPOST_PLATAFORMAS: ${{ vars.UPLOADPOST_PLATAFORMAS || 'tiktok' }}
          TIKTOK_MUSICA: ${{ vars.TIKTOK_MUSICA || 'si' }}
          IMAGENES_POR_EJECUCION: ${{ vars.IMAGENES_POR_EJECUCION || '1' }}
          AVISAR_CUANDO_QUEDEN: ${{ vars.AVISAR_CUANDO_QUEDEN || '8' }}
          MODO_PRUEBA: ${{ inputs.modo_prueba || 'no' }}
        run: |
          git config user.name "publicador-automatico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publicar.py
